# Gurobi parameters — PROJECT_BRIEF §6.7. `default` is complete; profiles override it.
default:
  TimeLimit: 120        # seconds per day
  MIPGap: 0.01
  Threads: 0            # 0 = all cores
  Seed: 0
  OutputFlag: 0         # logs go to results/<run>/.../gurobi.log
  MIPFocus: 0           # 0 balanced, 1 feasibility, 2 optimality, 3 bound
  write_lp: false       # write the model to .lp (tiny only)
  write_iis_on_infeasible: true
profiles:
  tiny:
    TimeLimit: 60
    MIPGap: 0.0
    write_lp: true
  small:
    TimeLimit: 120
  medium:
    TimeLimit: 120
  scale:
    TimeLimit: 300
