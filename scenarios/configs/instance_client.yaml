# client (APP maquette): a demanding `medium` week for the client mock-up. 36-42 orders a day,
# 8 drivers (5 full-time on staggered shifts, 1 part-time, 2 temp-agency), 8 trucks of which 2
# carry a tail-lift, 5-6 towns. Same customer types, contracts and costs as `medium`.
name: client
days: 5
orders_per_day: [36, 42]
customer_pool_factor: 2.0          # pool = 84 customers
towns: [5, 6]
town_distance_km: [15, 60]
customer_spread_km: [3, 6]
detour_factor: 1.3
speed_kmh: 55
access_minutes_per_leg: 4
asymmetric_noise: 0.05
customer_types:
  grocery:    {share: 0.40, window: [360, 600], pallets_lambda: 2.0, tail_lift_prob: 0.15, order_weight: 1.0, service_true: [12, 6, 0.30]}
  restaurant: {share: 0.40, window: [510, 690], pallets_lambda: 0.5, tail_lift_prob: 0.25, order_weight: 1.0, service_true: [14, 7, 0.45]}
  site:       {share: 0.20, window: [420, 900], pallets_lambda: 2.5, tail_lift_prob: 0.00, order_weight: 0.6, service_true: [18, 6, 0.55]}
weekday_factor: [1.15, 1.0, 1.0, 1.10, 0.90]
drivers:
  - {contract: full_time, shift_start: 330}    # 05:30
  - {contract: full_time, shift_start: 360}    # 06:00
  - {contract: full_time, shift_start: 360}    # 06:00
  - {contract: full_time, shift_start: 390}    # 06:30
  - {contract: full_time, shift_start: 420}    # 07:00
  - {contract: part_time, shift_start: 360}    # 06:00
  - {contract: temp_agency, shift_start: 360}  # 06:00, paid per minute + day fee
  - {contract: temp_agency, shift_start: 420}  # 07:00
trucks:
  - {capacity_pallets: 12, has_tail_lift: true}
  - {capacity_pallets: 15, has_tail_lift: false}
  - {capacity_pallets: 15, has_tail_lift: false}
  - {capacity_pallets: 18, has_tail_lift: false}
  - {capacity_pallets: 15, has_tail_lift: true}
  - {capacity_pallets: 18, has_tail_lift: false}
  - {capacity_pallets: 18, has_tail_lift: false}
  - {capacity_pallets: 15, has_tail_lift: false}
shift_span_max: 765
max_postponed_share: 0.20
