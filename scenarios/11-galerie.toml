summary = "60 tournées construites à la main, légales ou non, avec la règle attendue : le vérificateur les retrouve toutes."
story = """
Le vérificateur est le juge de tout le projet : aucun plan n'est montré s'il ne l'a pas validé. Il est écrit à partir des textes, indépendamment des planificateurs.

Pour s'assurer qu'il applique bien la loi, 60 tournées ont été construites à la main, chacune étiquetée « légale » ou avec la règle exacte qu'elle viole : les cas limites (270 / 271 min de conduite, 360 / 361 min de travail), les pauses mal placées, les créneaux manqués, la capacité, le hayon, les plafonds hebdomadaires, les pauses courtes et fractionnées. Chacune est rejugée à chaque compilation, et le verdict doit être exactement l'étiquette.

Choisissez une tournée pour voir son planning, les compteurs de la loi et le verdict.
"""

